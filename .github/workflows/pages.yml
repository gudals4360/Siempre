# GitHub Pages 배포: 화면(frontend)을 GitHub 서버에서 빌드해 올린다.
#  - 어느 브랜치에 올려도 "빌드가 되는지"만 확인한다 (배포는 하지 않는다)
#  - main에 올라가면(또는 Actions 탭에서 수동 실행하면) 빌드한 화면을 Pages로 배포한다
# 켜는 방법은 docs/deploy-github-pages.md. (저장소 설정 → Pages → Source를 "GitHub Actions"로)
name: Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 사이트가 놓일 기본 주소: 저장소 이름이 <계정>.github.io면 맨 위 주소('/'), 아니면 /<저장소 이름>/
      - name: 기본 주소 정하기
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE=/; else BASE="/$REPO/"; fi
          echo "VITE_BASE=$BASE" >> "$GITHUB_ENV"
          echo "기본 주소: $BASE"

      # 타입 검사 + 빌드. Firebase 웹 설정은 저장소 변수(Settings → Variables)에 넣으면 화면에 들어간다 (없으면 로그인만 비활성)
      - name: 빌드
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # Pages는 서버가 없어서 /login 같은 주소를 새로고침하면 404가 난다. 404 화면을 앱(index.html)으로 두어 앱이 이어받게 한다
      - name: 새로고침용 404.html
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    # main에서만 배포한다 (다른 브랜치는 위 빌드 확인까지만)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
